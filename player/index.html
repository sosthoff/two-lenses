<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two Lenses</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='12' cy='16' r='9' fill='%23f5b544' fill-opacity='.9'/><circle cx='20' cy='16' r='9' fill='%2338d4c4' fill-opacity='.8'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="player.css">
  <script>if (location.search.includes('mode=reel')) document.documentElement.classList.add('boot');</script>
</head>
<body>
  <div id="stage">
    <div class="glow"></div>
    <header>
      <div class="brand"><span class="logo"><i></i><i></i></span>Two Lenses</div>
      <div class="moment">
        <div class="eyebrow" id="counter"></div>
        <div class="moment-title" id="momentTitle"></div>
      </div>
      <div class="right">
        <nav class="timeline" id="timeline"></nav>
        <div class="controls" id="controls">
          <button id="prevBtn" title="Previous moment">←</button>
          <button id="playBtn">▶ Play reel</button>
          <button id="muteBtn">Sound off</button>
          <button id="nextBtn" title="Next moment">→</button>
        </div>
      </div>
    </header>
    <main class="cols" id="cols"></main>
    <footer>
      <div class="takeaway" id="takeaway"><span class="eyebrow">The difference</span><p></p></div>
    </footer>
    <div id="card" class="card hidden"></div>
  </div>
  <script type="module" src="player.js"></script>
</body>
</html>
